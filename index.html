
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maqueta de inicio de sesión</title>

<style>
:root {
    --fondo: #f5f5f5;
    --texto: #292929;
    --gris: #d9dadd;
    --amarillo: #ffdf00;
    --turquesa: #72cbd0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px 12px;
    background: var(--fondo);
    color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.top-accent {
    position: fixed;
    top: 0;
    left: 2.5%;
    width: 95%;
    height: 7px;
    background: #d9f1f2;
    border: 2px solid var(--turquesa);
    border-top: 0;
    border-radius: 0 0 15px 15px;
}

/* Tarjeta más pequeña */
.login-card {
    width: 100%;
    max-width: 440px;
    padding: 28px 26px 25px;
    background: #fff;
    border: 1px solid #f0f0f0;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,.09);
}

h1 {
    margin: 0 0 13px;
    text-align: center;
    font-size: 29px;
    line-height: 1.2;
    font-weight: 700;
}

.intro {
    max-width: 360px;
    margin: 0 auto 34px;
    text-align: center;
    font-size: 16px;
    line-height: 1.45;
}

/* Campos de entrada */
.field {
    margin: 0;
}

.input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 3px 5px;
    border-bottom: 1.4px solid #252525;
}

.input-wrap svg {
    width: 24px;
    height: 28px;
    flex: 0 0 24px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.65;
}

.input-wrap input {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 4px 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--texto);
    font-family: inherit;
    font-size: 17px;
}

.input-wrap input::placeholder {
    color: #303030;
    opacity: 1;
}

.help-link {
    display: inline-block;
    margin-top: 12px;
    color: var(--texto);
    font-size: 13px;
    line-height: 1.4;
    font-weight: 700;
    text-decoration: underline;
}

.field + .field {
    margin-top: 27px;
}

/* Botón más pequeño */
.submit {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: 100%;
    min-height: 48px;
    margin-top: 34px;
    padding: 10px 14px;
    border: none;
    border-radius: 40px;
    background: var(--gris);
    color: #77787b;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: not-allowed;
    transition: background-color .2s ease;
}

.submit.ready {
    background: var(--amarillo) !important;
    color: #292929 !important;
    cursor: pointer;
}

.submit:disabled {
    opacity: 1;
}

.create {
    display: block;
    margin-top: 25px;
    text-align: center;
    color: var(--texto);
    font-size: 16px;
    line-height: 1.4;
    font-weight: 700;
    text-decoration: underline;
}

.notice {
    display: none;
    margin: 13px 0 0;
    padding: 10px;
    background: #f4f8f8;
    border: 1px solid #c8e4e5;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.4;
}

.notice.show {
    display: block;
}

/* Móviles */
@media (max-width: 480px) {
    body {
        align-items: flex-start;
        padding: 20px 10px;
    }

    .login-card {
        width: 100%;
        max-width: 360px;
        margin: 9px auto 0;
        padding: 24px 19px 22px;
        border-radius: 14px;
    }

    h1 {
        font-size: 25px;
        margin-bottom: 11px;
    }

    .intro {
        font-size: 14px;
        margin-bottom: 29px;
    }

    .input-wrap {
        min-height: 40px;
        gap: 9px;
    }

    .input-wrap svg {
        width: 22px;
        height: 25px;
        flex-basis: 22px;
    }

    .input-wrap input {
        font-size: 15px;
    }

    .help-link {
        margin-top: 10px;
        font-size: 12px;
    }

    .field + .field {
        margin-top: 23px;
    }

    .submit {
        min-height: 43px;
        margin-top: 29px;
        padding: 9px 12px;
        font-size: 15px;
    }

    .create {
        margin-top: 22px;
        font-size: 14px;
    }
}

/* Pantallas muy estrechas */
@media (max-width: 350px) {
    .login-card {
        padding: 21px 15px 19px;
    }

    h1 {
        font-size: 23px;
    }

    .intro {
        font-size: 13px;
    }

    .input-wrap input {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="top-accent" aria-hidden="true"></div>

<main class="login-card">

    <h1>¡Hola!</h1>

    <p class="intro">
        Ingresa los datos para gestionar tus productos
        y hacer transacciones.
    </p>

    <form id="demoForm" autocomplete="off">

        <!-- Usuario -->
        <div class="field">

            <label class="input-wrap" for="usuario">
                <svg viewBox="0 0 40 44" aria-hidden="true">
                    <circle cx="20" cy="12" r="8"></circle>
                    <path d="M5 39v-4c0-7 6-11 15-11s15 4 15 11v4z"></path>
                </svg>

                <input
                    id="usuario"
                    type="text"
                    placeholder="Usuario"
                    aria-label="Usuario de demostración"
                    autocomplete="off">
            </label>

            <a href="#ayuda-usuario"
               class="help-link"
               data-message="Esta es una demostración local.">
                ¿Olvidaste tu usuario?
            </a>

        </div>

        <!-- Clave numérica de demostración -->
        <div class="field">

            <label class="input-wrap" for="clave">
                <svg viewBox="0 0 40 44" aria-hidden="true">
                    <rect x="7" y="18" width="26" height="23" rx="8"></rect>
                    <path d="M11 18V12a9 9 0 0 1 18 0v6"></path>
                    <circle cx="20" cy="28" r="2.5"></circle>
                    <path d="M20 30.5v4"></path>
                </svg>

                <input
                    id="clave"
                    type="number"
                    placeholder="Clave de 4 dígitos"
                    min="0"
                    max="9999"
                    step="1"
                    inputmode="numeric"
                    aria-label="Clave ficticia de demostración"
                    autocomplete="off">
            </label>

            <a href="#ayuda-clave"
               class="help-link"
               data-message="Esta es una demostración local.">
                ¿Olvidaste o bloqueaste tu clave?
            </a>

        </div>

        <button
            class="submit"
            id="submitBtn"
            type="submit"
            disabled>
            Iniciar sesión
        </button>

        <p class="notice" id="notice" role="status"></p>

    </form>

    <a href="#crear" class="create" id="createLink">
        Crear usuario
    </a>

</main>

<script>
const clave = document.getElementById("clave");
const boton = document.getElementById("submitBtn");
const aviso = document.getElementById("notice");

function actualizarBoton() {
    const valor = clave.value;
    const valido = /^\d{4}$/.test(valor);

    boton.disabled = !valido;
    boton.classList.toggle("ready", valido);
}

clave.addEventListener("input", function() {
    if (this.value.length > 4) {
        this.value = this.value.slice(0, 4);
    }

    actualizarBoton();
});

actualizarBoton();

function mostrarAviso(mensaje) {
    aviso.textContent = mensaje;
    aviso.classList.add("show");
}

/* Funcionamiento de demostración local */
document.getElementById("demoForm").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();

        mostrarAviso(
            "Demostración local: no se inició ninguna sesión " +
            "ni se enviaron datos a un servidor."
        );
    }
);

document.querySelectorAll("[data-message]").forEach(function(enlace) {
    enlace.addEventListener("click", function(event) {
        event.preventDefault();
        mostrarAviso(this.dataset.message);
    });
});

document.getElementById("createLink").addEventListener(
    "click",
    function(event) {
        event.preventDefault();

        mostrarAviso(
            "El registro de usuario es solo una demostración local."
        );
    }
);
</script>

</body>
</html>
