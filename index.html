<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maqueta de inicio de sesión</title>

<style>
:root {
  --ink: #292929;
  --line: #252525;
  --muted: #d9dadd;
  --yellow: #ffdc00;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px 30px;
  background: #f7f7f7;
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

/* Contenedor principal, con menor altura */
.login-card {
  width: min(100%, 760px);
  margin: 12px auto 0;
  background: #fff;
  border: 1px solid #f0f0f0;
  border-radius: 20px;
  padding: 42px 48px 32px;
  box-shadow: 0 9px 24px rgba(0, 0, 0, .12);
}

h1 {
  margin: 0 0 24px;
  text-align: center;
  font-size: clamp(32px, 5vw, 44px);
  font-weight: 700;
}

.intro {
  max-width: 620px;
  margin: 0 auto 56px;
  text-align: center;
  font-size: clamp(21px, 3.5vw, 31px);
  line-height: 1.45;
}

.field {
  margin-bottom: 12px;
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 58px;
  padding: 0 6px 5px;
  border-bottom: 2px solid var(--line);
}

.input-wrap:focus-within {
  border-bottom-color: #555;
}

.input-wrap svg {
  width: 38px;
  height: 40px;
  flex: 0 0 38px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
}

.input-wrap input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: clamp(22px, 3.8vw, 30px);
}

.input-wrap input::placeholder {
  color: #303030;
  opacity: 1;
}

.help-link {
  display: inline-block;
  margin-top: 18px;
  color: var(--ink);
  font-size: clamp(16px, 2.8vw, 22px);
  font-weight: 700;
  line-height: 1.35;
  text-decoration: underline;
}

.help-link:hover,
.create:hover {
  opacity: .75;
}

.field + .field {
  margin-top: 38px;
}

/* Botón desactivado */
.submit {
  display: block;
  width: 100%;
  min-height: 78px;
  margin-top: 68px;
  padding: 12px 18px;
  border: 0;
  border-radius: 60px;
  background: var(--muted);
  color: #888;
  font-family: inherit;
  font-size: clamp(24px, 4vw, 33px);
  font-weight: 700;
  cursor: not-allowed;
  transition: background .2s ease, color .2s ease;
}

/* Botón amarillo al completar cuatro dígitos */
.submit.ready {
  background: var(--yellow);
  color: #252525;
  cursor: pointer;
}

.submit.ready:hover {
  background: #f2cd00;
}

.create {
  display: block;
  width: fit-content;
  max-width: 100%;
  margin: 40px auto 0;
  color: var(--ink);
  text-align: center;
  font-size: clamp(20px, 3.2vw, 27px);
  font-weight: 700;
  text-decoration: underline;
}

.notice {
  display: none;
  margin: 18px 0 0;
  padding: 12px 14px;
  border: 1px solid #dedede;
  border-radius: 10px;
  background: #f7f7f7;
  font-size: 14px;
  line-height: 1.45;
}

.notice.show {
  display: block;
}

/* Enlaces debajo del contenedor */
.footer-links {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  margin: 100px auto 25px;
  text-align: center;
}

.footer-links a {
  color: #333;
  font-size: clamp(19px, 3vw, 27px);
  line-height: 1.35;
  text-decoration: none;
}

.footer-links a:hover {
  text-decoration: underline;
}

/* Ajustes para teléfonos */
@media (max-width: 600px) {
  body {
    padding: 16px 7px 24px;
  }

  .login-card {
    margin-top: 18px;
    padding: 36px 24px 28px;
    border-radius: 18px;
  }

  h1 {
    margin-bottom: 24px;
  }

  .intro {
    margin-bottom: 48px;
  }

  .input-wrap {
    min-height: 54px;
    gap: 13px;
  }

  .input-wrap svg {
    width: 32px;
    height: 36px;
    flex-basis: 32px;
  }

  .field + .field {
    margin-top: 34px;
  }

  .help-link {
    margin-top: 17px;
  }

  .submit {
    min-height: 72px;
    margin-top: 58px;
  }

  .create {
    margin-top: 34px;
  }

  .footer-links {
    gap: 30px;
    margin-top: 90px;
  }
}

@media (max-width: 360px) {
  .login-card {
    padding-right: 18px;
    padding-left: 18px;
  }

  .input-wrap {
    gap: 10px;
  }

  .input-wrap input {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<main class="login-card">
  <h1>¡Hola!</h1>

  <p class="intro">
    Ingresa los datos para gestionar tus productos y hacer transacciones.
  </p>

  <form id="demoForm" autocomplete="off">

    <div class="field">
      <label class="input-wrap" for="usuario">
        <svg viewBox="0 0 40 44" aria-hidden="true">
          <circle cx="20" cy="12" r="8"></circle>
          <path d="M5 39v-4c0-7 6-11 15-11s15 4 15 11v4z"></path>
        </svg>

        <input
          id="usuario"
          type="text"
          placeholder="Usuario"
          aria-label="Usuario"
          autocomplete="off"
        >
      </label>

      <a class="help-link" href="#ayuda-usuario"
         data-message="Demostración local: esta opción no está conectada a ningún servicio.">
        ¿Olvidaste tu usuario?
      </a>
    </div>

    <div class="field">
      <label class="input-wrap" for="clave">
        <svg viewBox="0 0 40 44" aria-hidden="true">
          <rect x="7" y="18" width="26" height="23" rx="8"></rect>
          <path d="M11 18V12a9 9 0 0 1 18 0v6"></path>
          <circle cx="20" cy="28" r="2.5"></circle>
          <path d="M20 30.5v4"></path>
        </svg>

        <input
          id="clave"
          type="password"
          inputmode="numeric"
          maxlength="4"
          pattern="[0-9]{4}"
          placeholder="Clave del cajero"
          aria-label="Clave ficticia para demostración"
          autocomplete="off"
        >
      </label>

      <a class="help-link" href="#ayuda-clave"
         data-message="Demostración local: la recuperación de clave no está conectada a ningún servicio.">
        ¿Olvidaste o bloqueaste tu clave?
      </a>
    </div>

    <button class="submit" id="submitBtn" type="submit" disabled>
      Iniciar sesión
    </button>

    <p class="notice" id="notice" role="status"></p>
  </form>

  <a class="create" href="#crear" id="createLink">
    Crear usuario
  </a>
</main>

<footer class="footer-links">
  <a href="#conexion"
     data-message="Demostración local: esta sección informativa no está conectada.">
    ¿Problemas para conectarte?
  </a>

  <a href="#seguridad"
     data-message="Demostración local: esta sección informativa no está conectada.">
    Aprende sobre seguridad
  </a>

  <a href="#reglamento"
     data-message="Demostración local: esta sección informativa no está conectada.">
    Reglamento Sucursal Virtual
  </a>
</footer>

<script>
const clave = document.getElementById("clave");
const submitBtn = document.getElementById("submitBtn");
const notice = document.getElementById("notice");
const demoForm = document.getElementById("demoForm");

function actualizarBoton() {
  const claveCompleta = /^[0-9]{4}$/.test(clave.value);

  submitBtn.disabled = !claveCompleta;
  submitBtn.classList.toggle("ready", claveCompleta);
}

function mostrarAviso(mensaje) {
  notice.textContent = mensaje;
  notice.classList.add("show");
}

clave.addEventListener("input", function() {
  clave.value = clave.value.replace(/[^0-9]/g, "").slice(0, 4);
  actualizarBoton();
});

demoForm.addEventListener("submit", function(event) {
  event.preventDefault();

  mostrarAviso(
    "Maqueta de demostración: no se ha iniciado sesión ni enviado información."
  );
});

document.querySelectorAll("[data-message]").forEach(function(enlace) {
  enlace.addEventListener("click", function(event) {
    event.preventDefault();
    mostrarAviso(this.dataset.message);
  });
});

document.getElementById("createLink").addEventListener("click", function(event) {
  event.preventDefault();

  mostrarAviso(
    "Demostración local: la creación de usuario no está conectada a ningún servicio."
  );
});

actualizarBoton();
</script>

</body>
</html>
