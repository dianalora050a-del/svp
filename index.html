```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f5f6f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #242424;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.07);
    }

    .top-line {
      height: 5px;
      background: #00a6c7;
    }

    .content {
      padding: 34px 32px 30px;
    }

    h1 {
      font-size: 29px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .intro {
      color: #555;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 21px;
    }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      height: 49px;
      border: 1px solid #b9bdc1;
      border-radius: 5px;
      padding: 0 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: #008eaa;
      box-shadow: 0 0 0 2px rgba(0, 166, 199, 0.12);
    }

    .field-icon {
      width: 20px;
      height: 20px;
      color: #555;
      flex-shrink: 0;
      margin-right: 11px;
    }

    .input-wrap input {
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      color: #242424;
    }

    .input-wrap input::placeholder {
      color: #888;
    }

    .field-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 9px;
    }

    .text-link {
      color: #007f9b;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      background: #d9dadd;
      color: #737373;
      font-size: 15px;
      font-weight: 700;
      cursor: not-allowed;
      transition: background 0.2s, color 0.2s;
    }

    .login-button.ready {
      background: #ffd400;
      color: #222;
      cursor: pointer;
    }

    .login-button.ready:hover {
      background: #f2c900;
    }

    .create-account {
      text-align: center;
      margin-top: 23px;
      font-size: 14px;
    }

    .create-account a {
      color: #007f9b;
      text-decoration: none;
      font-weight: 700;
    }

    .create-account a:hover {
      text-decoration: underline;
    }

    .notice {
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid #ececec;
      color: #777;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .message {
      display: none;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      color: #555;
    }

    .message.show {
      display: block;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
        align-items: flex-start;
        padding-top: 35px;
      }

      .login-card {
        max-width: 360px;
        margin: 0 auto;
      }

      .content {
        padding: 27px 22px 24px;
      }

      h1 {
        font-size: 26px;
      }

      .intro {
        font-size: 13px;
        margin-bottom: 23px;
      }

      .input-wrap {
        height: 45px;
      }

      .login-button {
        height: 43px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="top-line"></div>

    <div class="content">
      <h1>¡Hola!</h1>

      <p class="intro">
        Ingresa los datos para gestionar tus productos y hacer transacciones.
      </p>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label class="field-label" for="usuario">Usuario</label>

          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="1.7" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
            </svg>

            <input
              id="usuario"
              name="usuario"
              type="text"
              placeholder="Ingresa tu usuario"
              autocomplete="off"
            >
          </div>

          <div class="field-footer">
            <a href="#" class="text-link" data-message="La recuperación de usuario es solo una demostración local.">
              ¿Olvidaste tu usuario?
            </a>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="clave">Clave de 4 dígitos</label>

          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="1.7" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              <circle cx="12" cy="15" r="1"></circle>
            </svg>

            <input
              id="clave"
              name="clave"
              type="password"
              inputmode="numeric"
              pattern="[0-9]{4}"
              maxlength="4"
              placeholder="Ingresa tu clave"
              autocomplete="off"
              aria-describedby="clave-ayuda"
            >
          </div>

          <div class="field-footer">
            <a href="#" class="text-link" data-message="La recuperación de clave es solo una demostración local.">
              ¿Olvidaste o bloqueaste tu clave?
            </a>
          </div>

          <small id="clave-ayuda" style="display:block; color:#777; font-size:11px; margin-top:7px;">
            Escribe cuatro números.
          </small>
        </div>

        <button id="loginButton" class="login-button" type="submit" disabled>
          Iniciar sesión
        </button>

        <p id="message" class="message" role="status"></p>

        <div class="create-account">
          ¿No tienes usuario?
          <a href="#" data-message="La creación de usuario es solo una demostración local.">
            Crear usuario
          </a>
        </div>

        <p class="notice">
          Demostración de interfaz. No se envían ni se guardan usuarios o claves.
        </p>
      </form>
    </div>
  </main>

  <script>
    const usuario = document.getElementById("usuario");
    const clave = document.getElementById("clave");
    const loginButton = document.getElementById("loginButton");
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    function actualizarBoton() {
      // Se activa al ingresar cuatro dígitos, conservando ceros iniciales.
      const claveValida = /^[0-9]{4}$/.test(clave.value);

      loginButton.classList.toggle("ready", claveValida);
      loginButton.disabled = !claveValida;
    }

    clave.addEventListener("input", () => {
      // Acepta únicamente números y limita la longitud a cuatro.
      clave.value = clave.value.replace(/[^0-9]/g, "").slice(0, 4);
      actualizarBoton();
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      message.textContent =
        "Esta es una demostración visual. No se ha iniciado sesión ni enviado información.";
      message.classList.add("show");
    });

    document.querySelectorAll("[data-message]").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        message.textContent = link.dataset.message;
        message.classList.add("show");
      });
    });

    actualizarBoton();
  </script>
</body>
</html>
